name: Solace Health
description: 'Solace Health (solace.health) is a US healthcare navigation and patient-advocacy
  platform that matches patients and family caregivers with dedicated advocates, many
  covered by insurance, to handle administrative tasks, coordinate care and referrals,
  and fight for approvals and treatments. Advocates support members by video, phone,
  text, and email nationwide across a range of insurance plans, with a member app at
  app.solace.health. The company is venture-backed (IVP among its investors). As of
  this enrichment pass, Solace publishes a patient-facing service only and exposes no
  public developer API, API documentation, or developer portal.'
